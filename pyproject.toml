[project]
name = "parcel-rates-data"
version = "0.1.0"
description = "Data collection and rate-table pipeline for the parcel-rates dashboard"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["data/tests"]
addopts = "-ra"
